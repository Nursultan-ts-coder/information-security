# =============================================================================
# USE CASE 4: Load Balancer Configuration
# =============================================================================
# Purpose: Distribute traffic across multiple backend servers
# Port: 8004 -> balances between ports 5001, 5002, 5003
# =============================================================================

# Define upstream group with multiple backend servers
upstream api_backends {
    # Round-robin is default (remove 'least_conn' to use it)
    # least_conn;  # Uncomment for least connections method
    # ip_hash;     # Uncomment for session persistence

    server 127.0.0.1:5001;
    server 127.0.0.1:5002;
    server 127.0.0.1:5003;

    # Weighted example (uncomment to use):
    # server 127.0.0.1:5001 weight=3;  # Gets 3x traffic
    # server 127.0.0.1:5002 weight=2;  # Gets 2x traffic
    # server 127.0.0.1:5003 weight=1;  # Gets 1x traffic

    # Backup server (only used if others fail):
    # server 127.0.0.1:5004 backup;
}

server {
    listen 8004;
    server_name localhost;

    location / {
        proxy_pass http://api_backends;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# =============================================================================
# HOW TO USE:
# =============================================================================
# 1. Start 3 instances of FastAPI on different ports:
#    Terminal 1: PORT=5001 uvicorn main:app --host 127.0.0.1 --port 5001
#    Terminal 2: PORT=5002 uvicorn main:app --host 127.0.0.1 --port 5002
#    Terminal 3: PORT=5003 uvicorn main:app --host 127.0.0.1 --port 5003
#
# 2. Copy this config:
#    sudo cp 04-load-balancer.conf /etc/nginx/sites-available/loadbalancer
#
# 3. Enable and reload:
#    sudo ln -s /etc/nginx/sites-available/loadbalancer /etc/nginx/sites-enabled/
#    sudo nginx -t && sudo systemctl reload nginx
#
# 4. Test load balancing (note different server_port in responses):
#    for i in {1..10}; do curl -s http://localhost:8004/ | jq .server_port; done
#
# 5. You should see responses cycling through 5001, 5002, 5003
# =============================================================================
