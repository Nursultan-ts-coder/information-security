# =============================================================================
# USE CASE 1: Static Site Configuration
# =============================================================================
# Purpose: Serve static HTML/CSS/JS files directly from NGINX
# Port: 8001
# =============================================================================

server {
    listen 8001;
    server_name localhost;

    # Root directory for static files
    root /var/www/html/static-demo;
    index index.html;

    # Serve static files
    location / {
        try_files $uri $uri/ =404;
    }

    # Cache static assets (CSS, JS, images)
    location ~* \.(css|js|jpg|jpeg|png|gif|ico|svg|woff|woff2)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # Custom error pages
    error_page 404 /404.html;
    error_page 500 502 503 504 /50x.html;
}

# =============================================================================
# HOW TO USE:
# =============================================================================
# 1. Create the directory:
#    sudo mkdir -p /var/www/html/static-demo
#
# 2. Create index.html:
#    sudo nano /var/www/html/static-demo/index.html
#
# 3. Copy this config:
#    sudo cp 01-static-site.conf /etc/nginx/sites-available/static-demo
#
# 4. Enable the site:
#    sudo ln -s /etc/nginx/sites-available/static-demo /etc/nginx/sites-enabled/
#
# 5. Test and reload:
#    sudo nginx -t
#    sudo systemctl reload nginx
#
# 6. Access: http://localhost:8001
# =============================================================================
