# =============================================================================
# USE CASE 5: Rate Limiting Configuration
# =============================================================================
# Purpose: Protect API from abuse by limiting request rate
# Port: 8005
# =============================================================================

# Rate limit zone: 10MB memory, max 5 requests per second per IP
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=5r/s;

server {
    listen 8005;
    server_name localhost;

    # Rate-limited API endpoint
    location /api/ {
        # Apply rate limit: allow burst of 10, don't delay
        limit_req zone=api_limit burst=10 nodelay;

        # Return 429 (Too Many Requests) when limit exceeded
        limit_req_status 429;

        proxy_pass http://127.0.0.1:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Non-rate-limited static content
    location / {
        proxy_pass http://127.0.0.1:5000;
        proxy_set_header Host $host;
    }
}

# =============================================================================
# HOW TO USE:
# =============================================================================
# 1. Start FastAPI server:
#    uvicorn main:app --host 127.0.0.1 --port 5000
#
# 2. Copy this config:
#    sudo cp 05-rate-limiting.conf /etc/nginx/sites-available/ratelimit
#
# 3. Enable and reload:
#    sudo ln -s /etc/nginx/sites-available/ratelimit /etc/nginx/sites-enabled/
#    sudo nginx -t && sudo systemctl reload nginx
#
# 4. Test rate limiting (fast requests will be rejected):
#    for i in {1..20}; do curl -s -o /dev/null -w "%{http_code}\n" http://localhost:8005/api/users; done
#
# 5. You should see 200 for first ~15 requests, then 429 (rate limited)
# =============================================================================
