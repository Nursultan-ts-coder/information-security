# =============================================================================
# USE CASE 2: Reverse Proxy Configuration
# =============================================================================
# Purpose: Forward requests to FastAPI backend running on port 5000
# Port: 8002 -> proxies to 127.0.0.1:5000
# =============================================================================

server {
    listen 8002;
    server_name localhost;

    # Proxy all requests to FastAPI backend
    location / {
        proxy_pass http://127.0.0.1:5000;
        
        # Important headers to pass to backend
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Timeout settings
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
}

# =============================================================================
# HOW TO USE:
# =============================================================================
# 1. Start FastAPI server:
#    cd /path/to/lab-10/api
#    uvicorn main:app --host 127.0.0.1 --port 5000
#
# 2. Copy this config:
#    sudo cp 02-reverse-proxy.conf /etc/nginx/sites-available/api-proxy
#
# 3. Enable the site:
#    sudo ln -s /etc/nginx/sites-available/api-proxy /etc/nginx/sites-enabled/
#
# 4. Test and reload:
#    sudo nginx -t
#    sudo systemctl reload nginx
#
# 5. Test the proxy:
#    curl http://localhost:8002/
#    curl http://localhost:8002/api/users
#    curl http://localhost:8002/api/health
#
# 6. Compare direct vs proxy:
#    curl http://localhost:5000/    # Direct to FastAPI
#    curl http://localhost:8002/    # Through NGINX proxy
# =============================================================================
