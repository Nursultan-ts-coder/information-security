# =============================================================================
# USE CASE 3: API Proxy with Static Frontend
# =============================================================================
# Purpose: Serve static frontend + proxy /api/* to backend
# Port: 8003
# This is common for Single Page Applications (React, Vue, Angular)
# =============================================================================

server {
    listen 8003;
    server_name localhost;

    # Serve static frontend files
    root /var/www/html/webapp;
    index index.html;

    # Frontend routes - serve index.html for SPA routing
    location / {
        try_files $uri $uri/ /index.html;
    }

    # API routes - proxy to FastAPI backend
    location /api/ {
        proxy_pass http://127.0.0.1:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# =============================================================================
# HOW TO USE:
# =============================================================================
# 1. Create webapp directory:
#    sudo mkdir -p /var/www/html/webapp
#
# 2. Create index.html (see html/webapp-index.html)
#
# 3. Start FastAPI server:
#    uvicorn main:app --host 127.0.0.1 --port 5000
#
# 4. Copy this config:
#    sudo cp 03-api-with-frontend.conf /etc/nginx/sites-available/webapp
#
# 5. Enable and reload:
#    sudo ln -s /etc/nginx/sites-available/webapp /etc/nginx/sites-enabled/
#    sudo nginx -t && sudo systemctl reload nginx
#
# 6. Test:
#    Browser: http://localhost:8003 (shows frontend)
#    API: http://localhost:8003/api/users (proxied to backend)
# =============================================================================
