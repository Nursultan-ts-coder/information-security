<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Instagram Email Style</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        margin: 0;
        padding: 0;
        background-color: #fafafa;
      }
      .container {
        max-width: 600px;
        margin: 0 auto;
        background-color: #ffffff;
        padding: 20px;
        border-radius: 10px;
        box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
      }
      .header {
        display: flex;
        align-items: center;
        padding-bottom: 20px;
      }
      .header img {
        width: 30px;
        margin-right: 10px;
      }
      .header h2 {
        margin: 0;
        font-size: 24px;
        color: #333;
      }
      .button {
        display: inline-block;
        background-color: #3897f0;
        color: white;
        text-decoration: none;
        padding: 12px 24px;
        border-radius: 5px;
        font-size: 16px;
        text-align: center;
        border: none;
      }
      .footer {
        text-align: center;
        margin-top: 20px;
        font-size: 14px;
        color: #888;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="header">
        <img
          src="https://upload.wikimedia.org/wikipedia/commons/a/a5/Instagram_icon.png"
          alt="Instagram Logo"
        />
        <h2>Instagram</h2>
      </div>
      <p style="font-size: 16px; color: #333">You have a new notification!</p>
      <p style="font-size: 16px; color: #333">
        Hello, we've got an update for you. Follow the link below to learn more:
      </p>

      <a
        href="http://localhost:8000/instagram-login"
        style="
          font-size: 16px;
          color: #009bfc;
          cursor: pointer;
          text-decoration: underline;
        "
      >
        Click here to verify your account
      </a>

      <div class="footer">
        <p>If you didn’t request this, you can ignore this message.</p>
        <p>Instagram Inc., 1601 Willow Road, Menlo Park, CA 94025</p>
      </div>
    </div>
    <script>
      function redirectToPage() {
        window.open(
          "file:///Users/nursultanlukmanov/Documents/AUCA/Security/labs/lab-4/phishing/instagram-login.html",
          "_blank",
        ); // Opens in a new tab
      }
    </script>
  </body>
</html>
